<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duty Email Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: 450px 1fr;
  gap: 20px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  border: 2px solid rgba(255,255,255,.3);
}

.builder-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.builder-card h3 {
  margin: 0 0 8px 0;
  color: #333;
  font-size: 20px;
  border-bottom: 2px solid #007A33;
  padding-bottom: 8px;
}

label {
  font-weight: 600;
  font-size: 13px;
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  color: #444;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 2px solid #ddd;
  font-size: 14px;
  box-sizing: border-box;
  transition: border-color 0.2s;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: #007A33;
}

textarea { 
  resize: vertical; 
  min-height: 70px; 
  font-family: inherit;
}

button {
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.primary { background: #007A33; color: #fff; }
.primary:hover { background: #006028; }

.secondary { background: #333; color: #fff; }
.secondary:hover { background: #222; }

.danger { background: #b42318; color: #fff; }
.danger:hover { background: #9a1d14; }

.small { font-size: 12px; padding: 6px 10px; }

.preview {
  background: #f4f4f4;
  padding: 20px;
  border-radius: 8px;
  min-height: 400px;
}

.email-wrapper {
  max-width: 540px;
  margin: 0 auto;
  background-color: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.email-header {
  background-color: #007A33;
  color: #ffffff;
  text-align: center;
  padding: 24px 18px 20px;
  border-bottom: 3px solid #004d20;
}

.email-header h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  line-height: 1.3;
}

.email-content {
  padding: 30px 32px;
  line-height: 1.65;
  word-wrap: break-word;
}

.email-content h2 {
  font-size: 17px;
  font-weight: 700;
  color: #000000;
  margin-top: 30px;
  margin-bottom: 8px;
  border-left: 4px solid #007A33;
  padding-left: 8px;
}

.email-content p {
  margin: 6px 0 16px;
  font-size: 15px;
  color: #333333;
}

.email-content ul {
  margin: 8px 0 16px;
  padding-left: 20px;
}

.email-content li {
  margin: 4px 0;
  font-size: 15px;
  color: #333333;
}

.manager-box {
  background-color: #f9f9f9;
  border: 1px solid #e5e5e5;
  border-left: 4px solid #007A33;
  border-radius: 6px;
  padding: 12px 15px;
  margin-top: 10px;
}

.manager-box strong {
  display: block;
  font-size: 14px;
  color: #000000;
  margin-bottom: 4px;
}

.manager-box ul {
  margin: 0;
  padding-left: 20px;
}

.manager-box li {
  font-size: 14px;
  color: #333333;
  margin: 2px 0;
}

.email-footer {
  background-color: #fafafa;
  color: #555555;
  font-size: 13px;
  text-align: center;
  padding: 16px 20px;
  border-top: 1px solid #e5e5e5;
}

.row { 
  display: flex; 
  gap: 8px; 
  align-items: center; 
  margin-top: 8px; 
}

.crewing-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px;
  align-items: center;
  margin-top: 8px;
}

.crewing-row label {
  margin: 0;
  font-size: 13px;
  text-align: right;
  padding-right: 8px;
}

.crewing-row select {
  width: 100%;
  min-width: 150px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.modal-content {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  width: 900px;
  max-width: 95%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}

.modal-content h3 {
  margin-top: 0;
  margin-bottom: 16px;
  color: #007A33;
  border-bottom: 2px solid #007A33;
  padding-bottom: 8px;
}

.modal-content h4 {
  margin-top: 16px;
  margin-bottom: 12px;
  color: #333;
  font-size: 16px;
}

.tab-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.hidden { display: none; }

.settings-section {
  margin-top: 16px;
}

.settings-section:first-child {
  margin-top: 0;
}

.manager-item {
  background: #f8f9fa;
  padding: 16px;
  border-radius: 6px;
  border: 1px solid #ddd;
  margin-top: 12px;
}

.manager-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.manager-fields.full-width {
  grid-template-columns: 1fr;
}

.manager-fields-horizontal {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.2fr 2fr auto;
  gap: 8px;
  align-items: center;
}

.planned-closure-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.planned-closure-fields.full-width {
  grid-template-columns: 1fr;
}

.shift-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.comment-field {
  margin-top: 8px;
}

.closure-item {
  background: #f8f9fa;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ddd;
  margin-top: 12px;
  display: grid;
  grid-template-columns: 2fr 1.5fr 2fr 2fr auto;
  gap: 8px;
  align-items: center;
}

.closure-item:first-child {
  margin-top: 0;
}

.closure-item input {
  margin: 0;
}

.closure-item button {
  margin: 0;
}

.planned-closure-fields {
  margin-top: 8px;
}

.planned-closure-fields:first-child {
  margin-top: 0;
}

@media(max-width: 1000px){
  .container{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<!-- BUILDER -->
<div class="card builder-card">
  <h3>📋 Duty Email Builder</h3>

  <label>📅 Date</label>
  <input type="date" id="selectedDate">

  <label>📅 Day & Shift</label>
  <div class="shift-selector">
    <select id="day"></select>
    <select id="shift">
      <option value="Day">Day Shift</option>
      <option value="Night">Night Shift</option>
    </select>
  </div>

  <label>💬 Greeting Comment (Optional)</label>
  <textarea id="greetingComment" placeholder="Add any additional comments after the greeting..."></textarea>

  <label>✅ Tasks</label>
  <div id="taskDisplay" style="background: #f8f9fa; padding: 12px; border-radius: 6px; min-height: 40px; font-size: 13px; color: #666;">
    Configure tasks in Settings
  </div>

  <label>➕ Extra Tasks</label>
  <textarea id="extraTasks" placeholder="Add additional tasks (one per line)"></textarea>

  <label>🚑 Crewing Status</label>
  <div id="crewingChecks"></div>

  <label>📝 Crewing Notes</label>
  <textarea id="crewingNotes" placeholder="Additional crewing notes..."></textarea>

  <label>🛣️ Road Closures</label>
  <div id="closures"></div>
  <div style="display: flex; gap: 8px; margin-top: 8px;">
    <button class="small primary" onclick="openPlannedClosures()">📅 Plan Road Closures</button>
    <button class="small primary" onclick="addClosure()">➕ Add Road Closure</button>
  </div>

  <label>👤 Duty Manager</label>
  <select id="dutyManager"></select>

  <label>🚗 Fleet Movements</label>
  <textarea id="fleet" placeholder="Enter fleet movements or leave empty for default message"></textarea>

  <label>📌 Other</label>
  <textarea id="other" placeholder="Enter other notes or leave empty for default message"></textarea>

  <div class="row" style="margin-top: 16px;">
    <button class="primary" onclick="copyEmail()">📋 Copy Email</button>
    <button class="secondary" onclick="openSettings()">⚙️ Settings</button>
  </div>
</div>

<!-- PREVIEW -->
<div class="card">
  <h3>📧 Email Preview</h3>
  <div id="preview" class="preview"></div>
</div>

</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settings">
  <div class="modal-content">
    <h3>⚙️ Settings</h3>

    <div class="tab-buttons">
      <button class="primary small" onclick="showTab('callsignTab')">🚑 Callsigns</button>
      <button class="primary small" onclick="showTab('tasksTab')">✅ Tasks by Day</button>
      <button class="primary small" onclick="showTab('managersTab')">👤 Duty Managers</button>
      <button class="primary" onclick="saveSettingsWithFeedback(this)" style="margin-left: auto;">💾 Save Settings</button>
      <button class="danger small" onclick="closeSettings()">❌ Close</button>
    </div>

    <!-- CALLSIGNS -->
    <div id="callsignTab" class="settings-section">
      <h4>Crewing Callsigns</h4>
      <div id="callsignList" style="margin-top: 12px;"></div>
      <button class="small primary" onclick="addCallsign()" style="margin-top: 12px;">➕ Add Callsign</button>
    </div>

    <!-- TASKS -->
    <div id="tasksTab" class="hidden settings-section">
      <h4>Tasks by Day & Shift</h4>
      <label style="margin-top: 12px;">Select Day</label>
      <select id="taskDay"></select>
      <label style="margin-top: 12px;">Select Shift</label>
      <select id="taskShift">
        <option value="Day">Day Shift</option>
        <option value="Night">Night Shift</option>
      </select>
      <div id="taskList" style="margin-top: 12px;"></div>
      <button class="small primary" onclick="addTask()" style="margin-top: 12px;">➕ Add Task</button>
    </div>

    <!-- DUTY MANAGERS -->
    <div id="managersTab" class="hidden settings-section">
      <h4>Duty Managers</h4>
      <div id="managerList" style="margin-top: 12px;"></div>
      <button class="small primary" onclick="addManager()" style="margin-top: 12px;">➕ Add Manager</button>
    </div>

  </div>
</div>

<!-- PLANNED CLOSURES MODAL -->
<div class="modal" id="plannedClosuresModal">
  <div class="modal-content">
    <h3>📅 Planned Road Closures</h3>
    
    <div class="tab-buttons" style="margin-top: 16px;">
      <button class="primary small" onclick="showClosureTab('addClosureTab')">➕ Add Road Closure</button>
      <button class="primary small" onclick="showClosureTab('activeClosuresTab')">🟢 Active</button>
      <button class="primary small" onclick="showClosureTab('futureClosuresTab')">🔵 Future</button>
      <button class="primary small" onclick="showClosureTab('pastClosuresTab')">⚫ Past</button>
      <button class="secondary small" onclick="fetchRoadClosuresFromAPIs()">🌐 Import from APIs</button>
      <button class="primary" onclick="savePlannedClosuresWithFeedback(this)" style="margin-left: auto;">💾 Save</button>
      <button class="danger small" onclick="closePlannedClosures()">❌ Close</button>
    </div>

    <!-- Add Closure Tab -->
    <div id="addClosureTab" class="settings-section">
      <div id="newClosureForm" style="margin-top: 16px;"></div>
      <button class="small primary" onclick="addPlannedClosure()" style="margin-top: 12px;">➕ Add Planned Closure</button>
    </div>

    <!-- Active Closures Tab -->
    <div id="activeClosuresTab" class="hidden settings-section">
      <div id="activeClosuresList" style="margin-top: 16px;"></div>
    </div>

    <!-- Future Closures Tab -->
    <div id="futureClosuresTab" class="hidden settings-section">
      <div id="futureClosuresList" style="margin-top: 16px;"></div>
    </div>

    <!-- Past Closures Tab -->
    <div id="pastClosuresTab" class="hidden settings-section">
      <div id="pastClosuresList" style="margin-top: 16px;"></div>
    </div>
  </div>
</div>

<!-- API CLOSURES MODAL -->
<div class="modal" id="apiClosuresModal">
  <div class="modal-content" style="max-width: 800px;">
    <h3>🌐 Import Road Closures from APIs</h3>
    
    <div style="margin-top: 16px;">
      <button class="primary small" onclick="fetchFromNZTA()">Fetch NZTA</button>
      <button class="primary small" onclick="fetchFromNPDC()">Fetch NPDC</button>
      <button class="primary small" onclick="fetchFromSouthTaranaki()">Fetch South Taranaki</button>
      <button class="primary small" onclick="fetchFromStratford()">Fetch Stratford</button>
      <button class="primary small" onclick="fetchAllAPIs()">Fetch All</button>
    </div>
    
    <div id="apiClosuresList" style="margin-top: 20px; max-height: 500px; overflow-y: auto;">
      <p style="color: #666; font-style: italic;">Click a button above to fetch road closures from the APIs.</p>
    </div>
    
    <div style="margin-top: 16px; display: flex; gap: 8px;">
      <button class="danger small" onclick="closeAPIClosures()">❌ Close</button>
    </div>
  </div>
</div>

<script>
/* ---------- CONFIGURATION ---------- */
// Automatically detect the API URL based on current page location
// For Pages Functions, the API is at /api/data relative to your Pages URL
const API_BASE_URL = window.location.origin;

/* ---------- DATA STORAGE ---------- */
const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

// Default data
const defaultData = {
  callsigns: ["MIKE52","PAPA21"],
  dayTasks: Object.fromEntries(days.map(d=>[d, {Day: [], Night: []}])),
  dutyManagers: [{
    name: "Matthew Zimmerman",
    callsign: "MIKE52",
    number: "027 214 1929",
    email: "TaranakiDutyWom@stjohn.org.nz"
  }],
  plannedClosures: [],
  crewingStatus: {},
  temporaryClosures: []
};

let callsigns = [...defaultData.callsigns];
let dayTasks = {...defaultData.dayTasks};
let dutyManagers = [...defaultData.dutyManagers];
let plannedClosures = [...defaultData.plannedClosures];
let crewingStatus = {...defaultData.crewingStatus};

/* ---------- API FUNCTIONS ---------- */
async function loadDataFromAPI() {
  if (!API_BASE_URL) {
    // Fallback to localStorage
    loadDataFromLocalStorage();
    return;
  }

  try {
    const response = await fetch(`${API_BASE_URL}/api/data`);
    if (response.ok) {
      const data = await response.json();
      if (data && Object.keys(data).length > 0) {
        callsigns = data.callsigns || defaultData.callsigns;
        dayTasks = data.dayTasks || defaultData.dayTasks;
        dutyManagers = data.dutyManagers || defaultData.dutyManagers;
        plannedClosures = data.plannedClosures || defaultData.plannedClosures;
        crewingStatus = data.crewingStatus || defaultData.crewingStatus;
        
        // Save temporary closures if available
        if (data.temporaryClosures) {
          localStorage.setItem("temporaryClosures", JSON.stringify(data.temporaryClosures));
        }
        
        // Also save to localStorage as backup
        saveDataToLocalStorage();
        return;
      }
    }
  } catch (error) {
    console.log("API load failed, using localStorage:", error);
  }
  
  // Fallback to localStorage if API fails
  loadDataFromLocalStorage();
}

async function saveDataToAPI() {
  // Always save to localStorage as backup
  saveDataToLocalStorage();
  
  if (!API_BASE_URL) return;

  try {
    const data = {
      callsigns,
      dayTasks,
      dutyManagers,
      plannedClosures,
      crewingStatus,
      temporaryClosures: getTemporaryClosuresData()
    };
    
    await fetch(`${API_BASE_URL}/api/data`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (error) {
    console.log("API save failed, data saved to localStorage only:", error);
  }
}

function loadDataFromLocalStorage() {
  callsigns = JSON.parse(localStorage.getItem("callsigns")) || defaultData.callsigns;
  const savedDayTasks = JSON.parse(localStorage.getItem("dayTasks"));
  if (savedDayTasks) {
    // Migrate old format if needed
    dayTasks = {};
    days.forEach(d => {
      if (savedDayTasks[d]) {
        if (Array.isArray(savedDayTasks[d])) {
          dayTasks[d] = {Day: savedDayTasks[d], Night: []};
        } else {
          dayTasks[d] = savedDayTasks[d];
        }
      } else {
        dayTasks[d] = {Day: [], Night: []};
      }
    });
  } else {
    dayTasks = defaultData.dayTasks;
  }
  dutyManagers = JSON.parse(localStorage.getItem("dutyManagers")) || defaultData.dutyManagers;
  plannedClosures = JSON.parse(localStorage.getItem("plannedClosures")) || defaultData.plannedClosures;
  crewingStatus = JSON.parse(localStorage.getItem("crewingStatus")) || defaultData.crewingStatus;
}

function saveDataToLocalStorage() {
  localStorage.setItem("callsigns", JSON.stringify(callsigns));
  localStorage.setItem("dayTasks", JSON.stringify(dayTasks));
  localStorage.setItem("dutyManagers", JSON.stringify(dutyManagers));
  localStorage.setItem("plannedClosures", JSON.stringify(plannedClosures));
  localStorage.setItem("crewingStatus", JSON.stringify(crewingStatus));
}

function getTemporaryClosuresData() {
  return [...closures.children].map(item => {
    const inputs = [...item.querySelectorAll("input")];
    return {
      roadName: inputs[0]?.value || "",
      type: inputs[1]?.value || "",
      closureInfo: inputs[2]?.value || "",
      detour: inputs[3]?.value || ""
    };
  });
}

/* ---------- INIT ---------- */
days.forEach(d=>{
  day.innerHTML += `<option>${d}</option>`;
  taskDay.innerHTML += `<option>${d}</option>`;
});

// Set current date
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
selectedDate.value = todayStr;

// Set current day
day.value = today.toLocaleDateString("en-NZ",{weekday:"long"});

// Set default shift based on time
const hour = today.getHours();
shift.value = (hour >= 6 && hour < 18) ? "Day" : "Night";

// Update day when date changes
selectedDate.addEventListener("change", () => {
  const selected = new Date(selectedDate.value);
  day.value = selected.toLocaleDateString("en-NZ",{weekday:"long"});
  updateTaskDisplay();
  checkPlannedClosures();
  render();
});

/* ---------- SETTINGS ---------- */
function openSettings(){ 
  settings.style.display = "flex"; 
  renderSettings(); 
}

function closeSettings(){ 
  settings.style.display = "none"; 
}

function showTab(id){
  callsignTab.classList.add("hidden");
  tasksTab.classList.add("hidden");
  managersTab.classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}

function renderSettings(){
  // Render callsigns
  callsignList.innerHTML = "";
  callsigns.forEach((c,i)=>{
    callsignList.innerHTML += `
      <div class="row" style="margin-top: ${i === 0 ? '0' : '8px'};">
        <input value="${c}" onchange="callsigns[${i}]=this.value">
        <button class="danger small" onclick="callsigns.splice(${i},1);renderSettings()">➖</button>
      </div>`;
  });
  
  renderTasks();
  renderManagers();
  renderCrewingChecks();
}

function addCallsign(){
  callsigns.push("");
  renderSettings();
}

function renderTasks(){
  taskList.innerHTML = "";
  const dayKey = taskDay.value;
  const shiftKey = taskShift.value;
  
  // Initialize if needed
  if (!dayTasks[dayKey]) dayTasks[dayKey] = {Day: [], Night: []};
  if (!dayTasks[dayKey][shiftKey]) dayTasks[dayKey][shiftKey] = [];
  
  dayTasks[dayKey][shiftKey].forEach((t,i)=>{
    taskList.innerHTML += `
      <div class="row" style="margin-top: ${i === 0 ? '0' : '8px'};">
        <input value="${t}" onchange="dayTasks['${dayKey}']['${shiftKey}'][${i}]=this.value">
        <button class="danger small" onclick="dayTasks['${dayKey}']['${shiftKey}'].splice(${i},1);renderTasks()">➖</button>
      </div>`;
  });
}

function addTask(){
  const dayKey = taskDay.value;
  const shiftKey = taskShift.value;
  
  if (!dayTasks[dayKey]) dayTasks[dayKey] = {Day: [], Night: []};
  if (!dayTasks[dayKey][shiftKey]) dayTasks[dayKey][shiftKey] = [];
  
  dayTasks[dayKey][shiftKey].push("");
  renderTasks();
}

function updateTaskDisplay(){
  const dayKey = day.value;
  const shiftKey = shift.value;
  
  // Handle old format (array) or new format (object with Day/Night)
  let currentTasks = [];
  if (dayTasks[dayKey]) {
    if (Array.isArray(dayTasks[dayKey])) {
      // Old format - migrate
      currentTasks = dayTasks[dayKey];
      dayTasks[dayKey] = {Day: dayTasks[dayKey], Night: []};
    } else {
      currentTasks = dayTasks[dayKey][shiftKey] || [];
    }
  }
  
  if (currentTasks.length > 0) {
    taskDisplay.innerHTML = currentTasks.map(t => `• ${t}`).join("<br>");
  } else {
    taskDisplay.innerHTML = "No tasks configured for this day/shift. Add them in Settings.";
  }
}

function renderManagers(){
  managerList.innerHTML = "";
  dutyManagers.forEach((m,i)=>{
    managerList.innerHTML += `
      <div class="manager-item">
        <div class="manager-fields-horizontal">
          <input placeholder="Name" value="${m.name}" onchange="dutyManagers[${i}].name=this.value">
          <input placeholder="Callsign" value="${m.callsign}" onchange="dutyManagers[${i}].callsign=this.value">
          <input placeholder="Number" value="${m.number}" onchange="dutyManagers[${i}].number=this.value">
          <input placeholder="Email" value="${m.email}" onchange="dutyManagers[${i}].email=this.value">
          <button class="danger small" onclick="dutyManagers.splice(${i},1);renderManagers()">➖ Remove</button>
        </div>
      </div>`;
  });
}

function addManager(){
  dutyManagers.push({
    name: "",
    callsign: "",
    number: "",
    email: ""
  });
  renderManagers();
}

function updateManagerDropdown(){
  dutyManager.innerHTML = '<option value="">Please select...</option>';
  dutyManagers.forEach((m,i)=>{
    dutyManager.innerHTML += `<option value="${i}">${m.name || 'Unnamed'} (${m.callsign || 'No callsign'})</option>`;
  });
}

async function saveSettings(){
  await saveDataToAPI();
  renderSettings();
  updateManagerDropdown();
  updateTaskDisplay();
  render();
}

async function saveSettingsWithFeedback(button){
  const saveButton = button || document.querySelector('button[onclick*="saveSettingsWithFeedback"]');
  if (!saveButton) return;
  
  const originalText = saveButton.textContent;
  
  saveButton.disabled = true;
  saveButton.textContent = "💾 Saving...";
  
  try {

async function fetchFromAPI(sourceName, endpoint){
  try {
    const loadingDiv = document.createElement('div');
    loadingDiv.setAttribute('data-source', sourceName);
    loadingDiv.style.cssText = 'margin-top: 16px; padding: 12px; background: #f8f9fa; border-radius: 6px;';
    loadingDiv.innerHTML = `<p style="color: #666;">Fetching from ${sourceName}...</p>`;
    apiClosuresList.appendChild(loadingDiv);
    
    const response = await fetch(API_BASE_URL + endpoint);
    if (!response.ok) {
      throw new Error(`Failed to fetch from ${sourceName}`);
    }
    
    const data = await response.json();
    const closures = data.closures || [];
    
    loadingDiv.remove();
    
    if (closures.length === 0) {
      const noDataDiv = document.createElement('div');
      noDataDiv.setAttribute('data-source', sourceName);
      noDataDiv.style.cssText = 'margin-top: 16px; padding: 12px; background: #f8f9fa; border-radius: 6px;';
      noDataDiv.innerHTML = `<p style="color: #999; font-style: italic;">No closures found from ${sourceName}.</p>`;
      apiClosuresList.appendChild(noDataDiv);
      return;
    }
    
    // Add source to each closure
    closures.forEach(c => {
      c.source = sourceName;
      c.id = `${sourceName}-${Date.now()}-${Math.random()}`;
    });
    
    fetchedClosures.push(...closures);
    renderAPIClosures();
  } catch (error) {
    console.error(`Error fetching from ${sourceName}:`, error);
    const errorDiv = document.createElement('div');
    errorDiv.setAttribute('data-source', sourceName);
    errorDiv.style.cssText = 'margin-top: 16px; padding: 12px; background: #fff3cd; border-radius: 6px; border-left: 4px solid #ffc107;';
    errorDiv.innerHTML = `<p style="color: #856404; margin: 0;"><strong>${sourceName}:</strong> Error fetching data. ${error.message}</p>`;
    apiClosuresList.appendChild(errorDiv);
  }
}

  if (fetchedClosures.length === 0) {
    apiClosuresList.innerHTML = '<p style="color: #666; font-style: italic;">No closures fetched yet. Click a button above to fetch.</p>';
    return;
  }
  
  apiClosuresList.innerHTML = '<h4 style="margin: 0 0 16px 0; color: #333;">Fetched Closures:</h4>';
  
  fetchedClosures.forEach((closure, index) => {
    const closureDiv = document.createElement('div');
    closureDiv.style.cssText = 'margin-bottom: 16px; padding: 16px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #007A33;';

    const endDate = closure.endDate || closure.end_date || 'Not specified';
    const roadName = closure.roadName || closure.road_name || closure.road || 'Unknown Road';
    const type = closure.type || closure.closureType || 'Road Closure';
    const info = closure.closureInfo || closure.info || closure.description || '';
    const detour = closure.detour || closure.detourInfo || '';

function acceptAPIClosure(index){
  const closure = fetchedClosures[index];
  
  // Convert to our format
  const newClosure = {
    startDate: closure.startDate || closure.start_date || '',
    endDate: closure.endDate || closure.end_date || '',
    shiftType: closure.shiftType || 'All',
    roadName: closure.roadName || closure.road_name || closure.road || '',
    type: closure.type || closure.closureType || '',
    closureInfo: closure.closureInfo || closure.info || closure.description || '',
    detour: closure.detour || closure.detourInfo || ''
  };
  
  plannedClosures.push(newClosure);
  fetchedClosures.splice(index, 1);
  
  renderAPIClosures();
  renderNewClosureForm();
  
  // Show success message
  const successMsg = document.createElement('div');
  successMsg.style.cssText = 'position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #d4edda; color: #155724; border-radius: 6px; border-left: 4px solid #28a745; z-index: 10000;';

  document.body.appendChild(successMsg);
  setTimeout(() => successMsg.remove(), 3000);
}

function checkPlannedClosures(){
  const today = new Date();
  const currentDay = day.value;
  const currentShift = shift.value;
  const todayStr = today.toISOString().split('T')[0];
  
  plannedClosures.forEach(closure => {
    if (!closure.startDate || !closure.endDate) return;
    
    const startDate = new Date(closure.startDate);
    const endDate = new Date(closure.endDate);
    endDate.setHours(23, 59, 59);
    
    if (today >= startDate && today <= endDate) {
      const shiftMatch = closure.shiftType === "All" || 
                        closure.shiftType === currentShift;
      
      if (shiftMatch) {
        // Check if already added
        const alreadyAdded = [...closures.children].some(item => {
          const inputs = [...item.querySelectorAll("input")];
          return inputs[0]?.value === closure.roadName;
        });
        
        if (!alreadyAdded) {
          addClosureFromPlanned(closure);
        }
      }
    }
  });
}

async function copyEmail(){
  render();
  await new Promise(resolve => setTimeout(resolve, 100));
  
  // Get the full HTML from preview
  const emailHTML = preview.innerHTML;
  
  try {
    // Try modern clipboard API first
    if (navigator.clipboard && navigator.clipboard.write) {
      const blob = new Blob([emailHTML], { type: 'text/html' });
      const clipboardItem = new ClipboardItem({ 'text/html': blob });
      await navigator.clipboard.write([clipboardItem]);
      alert("✅ Copied for Outlook Web! Paste into your email editor (Ctrl+V or Cmd+V).");
      return;
    }
  } catch (err) {
    console.log("Clipboard API failed, trying fallback");
  }
  
  // Fallback: select the preview content for copying
  const r = document.createRange();
  r.selectNodeContents(preview);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  
  try {
    document.execCommand("copy");
    s.removeAllRanges();
    alert("✅ Copied for Outlook Web! Paste into your email editor (Ctrl+V or Cmd+V).");
  } catch (err) {
    alert("⚠️ Please manually select and copy the preview content.");
  }
}
